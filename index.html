<!DOCTYPE html>
<html lang="zu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIYABANGENA MASKANDI AI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">
<header class="p-4 flex justify-between items-center border-b border-yellow-500/20">
<h1 class="font-black text-yellow-400">SIYABANGENA</h1>
<div class="bg-zinc-800 px-3 py-1 rounded-full text-xs">150 Credits</div>
</header>
<main class="max-w-md mx-auto p-6">
<h2 class="text-4xl font-black text-center mt-4">Dala i-<span class="text-yellow-400">Maskandi</span><br>nge-AI</h2>
<p class="text-center text-gray-400 text-sm mt-3">I-AI yokuqala eSouth Africa</p>

<div class="grid grid-cols-2 gap-3 mt-8">
<button class="bg-yellow-400 text-black p-4 rounded-2xl font-bold">🎸 Maskandi</button>
<button class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl font-bold">🎹 Amapiano</button>
</div>

<textarea id="prompt" class="w-full bg-zinc-900 mt-6 p-4 rounded-2xl h-28 border border-zinc-800 text-sm" placeholder="Bhala isitayela: 'Maskandi esheshayo, isiginci esibukhali, 120 BPM'"></textarea>

<button onclick="alert('Siyabonga! Ingoma yakho izokwakhiwa. (Demo - AI izoxhunywa maduze)')" class="w-full mt-4 bg-yellow-400 text-black py-4 rounded-full font-black text-lg">Dala Ingoma (1 Credit)</button>

<div class="mt-8 p-4 bg-zinc-900 rounded-2xl">
<p class="font-bold text-yellow-400 text-sm">💳 Amanani:</p>
<p class="text-xs text-gray-400 mt-2">150 MAHHALA ekuqaleni, 10 songs/day<br>R150 = 150 Credits<br>R300 = 350 Credits</p>
</div>

<p class="text-center text-xs text-gray-600 mt-6">Yenziwe eKwaDabeka, KZN</p>
</main>
</body>
</html>
